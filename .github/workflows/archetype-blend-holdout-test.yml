name: Archetype-blend hold-out test (multi-magnitude)

# Tests THREE held-out avatars, all derived from Goblin's own rig at
# increasing deformation magnitude (mild/moderate/extreme), each paired
# with the same Puffer_dense garment used by Goblin_Jacket/Trex_Jacket.
#
# IMPORTANT LIMITATION, stated plainly: this cannot test a body genuinely
# "between" Goblin and Trex, because Goblin and Trex use completely
# different mesh topologies/skeletons — interpolating between them
# requires solving cross-rig correspondence, which is the exact open
# problem this whole pivot is about. What this CAN test: how far a
# single archetype's correction stays accurate as the query body moves
# away from it, and whether naive blending ever starts adding value as
# that distance grows. Real bbox-ratio check (solver working frame, not
# raw asset files) confirmed Goblin and Trex are already almost the same
# overall size (~1.0-1.1x) — the difference between them is topology/
# anatomy, not scale — so "distance from Goblin" here means deformation
# magnitude of the SAME rig, not genuine progress toward Trex's shape.
#
# Requires three avatar directories already committed to THIS repo:
#   garment-data/assets/avatars/{Held_Out,Held_Out_Moderate,Held_Out_Extreme}/
#     {avatar.obj, skeleton.obj, skin.txt}
#   garment-data/{Held_Out_Jacket,Held_Out_Jacket_Moderate,Held_Out_Jacket_Extreme}/
#     setup.json (garment_mesh_path/source_skeleton_path still Puffer_dense)
on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git ccache \
            libboost-all-dev \
            libtbb-dev \
            libblosc-dev \
            libopenblas-dev liblapack-dev \
            libsuitesparse-dev
          pip install --break-system-packages -q trimesh numpy

      - name: Checkout this repo
        # This workflow runs inside YOUR repo, which already has the
        # cloth-fit source plus the held-out avatar committed — no need
        # to re-clone upstream. Checked out into a "cloth-fit" subfolder
        # so every later `working-directory: cloth-fit` below still works
        # unchanged.
        uses: actions/checkout@v4
        with:
          path: cloth-fit

      - name: Check held-out example exists before doing any real work
        run: |
          for d in cloth-fit/garment-data/Held_Out_Jacket cloth-fit/garment-data/Held_Out_Jacket_Moderate cloth-fit/garment-data/Held_Out_Jacket_Extreme; do
            if [ ! -f "$d/setup.json" ]; then
              echo "::error::$d/setup.json not found. This workflow needs all three held-out avatars committed first — see the comments at the top of this file. Nothing to test without it."
              exit 1
            fi
            echo "Found: $d"
          done

      - name: Patch BLAS/LAPACK linkage onto the executables
        # Proven fix (rounds 1-3 of the original build spike): polysolve's
        # blas.cmake creates BLAS::BLAS as a child-scope-only imported
        # target; cloth-fit's own top-level CMakeLists.txt can't see it
        # from the parent scope. Fixed by calling find_package(BLAS/LAPACK
        # REQUIRED) directly in cloth-fit's own CMakeLists.txt right after
        # it links polysolve — polysolve's blas.cmake starts with
        # `if(TARGET BLAS::BLAS) return()`, so it reuses ours instead of
        # re-declaring, and cholmod ends up with a real link edge to both.
        run: |
          cd cloth-fit
          sed -i \
            's/target_link_libraries(polyfem PUBLIC polysolve::polysolve)/target_link_libraries(polyfem PUBLIC polysolve::polysolve)\n\nfind_package(BLAS REQUIRED)\nfind_package(LAPACK REQUIRED)/' \
            CMakeLists.txt
          grep -n "find_package(BLAS\|find_package(LAPACK" CMakeLists.txt

      - name: Cache CMake FetchContent / build deps
        uses: actions/cache@v4
        with:
          path: cloth-fit/build/_deps
          key: cloth-fit-deps-${{ hashFiles('cloth-fit/CMakeLists.txt') }}
          restore-keys: |
            cloth-fit-deps-

      - name: Cache CPM source cache (~/.cache/CPM)
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cloth-fit-cpm-${{ hashFiles('cloth-fit/CMakeLists.txt') }}
          restore-keys: |
            cloth-fit-cpm-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Configure
        working-directory: cloth-fit
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DPOLYSOLVE_WITH_MKL=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ..

      - name: Patch SuiteSparse BLAS symbol-suffix convention
        # Proven fix (round 4): polysolve's suitesparse.cmake hardcodes
        # HAVE_BLAS_NO_UNDERSCORE ON / HAVE_BLAS_UNDERSCORE OFF
        # unconditionally. Ubuntu's apt libopenblas.so exports the
        # standard underscored Fortran symbols (dgemm_, not dgemm), so
        # cholmod's internal macros call the wrong name. Flip both
        # values in the vendored recipe CPM already fetched, then
        # reconfigure so SuiteSparse's add_compile_definitions() reruns
        # with the corrected convention.
        working-directory: cloth-fit/build
        run: |
          f=$(find "$HOME/.cache/CPM/polysolve" -path "*/cmake/recipes/suitesparse.cmake" 2>/dev/null | head -n1)
          test -n "$f" && test -f "$f" || { echo "::error::couldn't find polysolve's suitesparse.cmake under \$HOME/.cache/CPM — did Configure step run first?"; exit 1; }
          echo "Found: $f"
          sed -i \
            -e 's/set(HAVE_BLAS_NO_UNDERSCORE ON)/set(HAVE_BLAS_NO_UNDERSCORE OFF)/' \
            -e 's/set(HAVE_BLAS_UNDERSCORE OFF)/set(HAVE_BLAS_UNDERSCORE ON)/' \
            "$f"
          grep -n "HAVE_BLAS_.*UNDERSCORE" "$f"
          grep -q "set(HAVE_BLAS_UNDERSCORE ON)" "$f" || { echo "::error::patch did not apply — sed patterns no longer match $f"; exit 1; }
          cmake -DCMAKE_BUILD_TYPE=Release -DPOLYSOLVE_WITH_MKL=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ..

      - name: Build
        working-directory: cloth-fit/build
        run: |
          nproc
          free -h
          make -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/cloth-fit/build.log"

      - name: Check binary exists
        working-directory: cloth-fit/build
        run: |
          find . -maxdepth 2 -iname "PolyFEM_bin*" -exec ls -la {} \;

      - name: Run Goblin_Jacket, Trex_Jacket, and all three held-out levels
        working-directory: cloth-fit
        run: |
          for example in Goblin_Jacket Trex_Jacket Held_Out_Jacket Held_Out_Jacket_Moderate Held_Out_Jacket_Extreme; do
            echo "=== Running $example ==="
            cd "garment-data/$example"
            ../../build/PolyFEM_bin -j setup.json --max_threads "$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/cloth-fit/${example//\//_}.log"
            cd ../..
          done

      - name: Compute blend prediction and compare against the real held-out fit
        # The actual hypothesis test. Both Goblin_Jacket and Trex_Jacket
        # start from the same step_garment_0.obj (same garment, same
        # reference pose) — confirmed directly in the prior spike, not
        # assumed here. This computes each one's per-vertex displacement
        # field, averages them 50/50 as the "predicted" correction, and
        # compares that prediction against the held-out avatar's own real
        # (independently solved) final fit. This is a first, simplest-
        # possible version of blending (plain average, not real RBF
        # shape-distance weighting) — deliberately, to test the core idea
        # cheaply before building anything fancier.
        working-directory: cloth-fit
        run: |
          python3 << 'EOF' | tee "$GITHUB_WORKSPACE/cloth-fit/holdout-test-results.log"
          import trimesh
          import numpy as np
          import glob
          import os

          def final_step(dirpath):
              files = glob.glob(os.path.join(dirpath, "step_garment_*.obj"))
              if not files:
                  raise SystemExit(f"::error::no step_garment_*.obj found in {dirpath}")
              idx = max(int(os.path.basename(f).split("_")[-1].split(".")[0]) for f in files)
              return os.path.join(dirpath, f"step_garment_{idx}.obj")

          goblin_dir, trex_dir = "garment-data/Goblin_Jacket", "garment-data/Trex_Jacket"
          v0_goblin = np.asarray(trimesh.load(os.path.join(goblin_dir, "step_garment_0.obj"), process=False).vertices)
          v0_trex   = np.asarray(trimesh.load(os.path.join(trex_dir, "step_garment_0.obj"), process=False).vertices)
          vf_goblin = np.asarray(trimesh.load(final_step(goblin_dir), process=False).vertices)
          vf_trex   = np.asarray(trimesh.load(final_step(trex_dir), process=False).vertices)
          disp_goblin = vf_goblin - v0_goblin
          disp_trex   = vf_trex - v0_trex

          def evaluate(name, v0_h, vf_h, disp_predicted, real_scale):
              vf_predicted = v0_h + disp_predicted
              err = np.linalg.norm(vf_predicted - vf_h, axis=1)
              corr = np.corrcoef(np.linalg.norm(disp_predicted, axis=1), real_scale)[0, 1]
              print(f"  {name:45s} err_mean={err.mean():.4f}  err/real={err.mean()/max(real_scale.mean(),1e-9):.1%}  corr={corr:.3f}")
              return err.mean()

          levels = {
              "mild (Held_Out_Jacket, scale~1.1-1.2)": "garment-data/Held_Out_Jacket",
              "moderate (scale~1.35-1.45)":            "garment-data/Held_Out_Jacket_Moderate",
              "extreme (scale~1.7-1.9)":                "garment-data/Held_Out_Jacket_Extreme",
          }

          summary = []
          for label, d in levels.items():
              v0_h = np.asarray(trimesh.load(os.path.join(d, "step_garment_0.obj"), process=False).vertices)
              vf_h = np.asarray(trimesh.load(final_step(d), process=False).vertices)
              if v0_h.shape[0] != disp_goblin.shape[0]:
                  print(f"::error::{d}: vertex count mismatch, skipping rather than faking a comparison")
                  continue
              disp_real = vf_h - v0_h
              real_scale = np.linalg.norm(disp_real, axis=1)
              print(f"\n=== {label} ===")
              print(f"  real displacement: mean={real_scale.mean():.4f} max={real_scale.max():.4f}")
              e_none   = evaluate("no correction",        v0_h, vf_h, np.zeros_like(disp_real), real_scale)
              e_goblin = evaluate("Goblin alone",          v0_h, vf_h, disp_goblin, real_scale)
              e_trex   = evaluate("Trex alone",             v0_h, vf_h, disp_trex, real_scale)
              e_blend  = evaluate("50/50 blend",            v0_h, vf_h, 0.5*disp_goblin + 0.5*disp_trex, real_scale)
              summary.append((label, e_none, e_goblin, e_trex, e_blend))

          print("\n=== DEGRADATION CURVE: mean error, lower is better ===")
          print(f"  {'level':45s} {'no_corr':>8s} {'goblin':>8s} {'trex':>8s} {'blend':>8s}")
          for label, e_none, e_goblin, e_trex, e_blend in summary:
              print(f"  {label:45s} {e_none:8.4f} {e_goblin:8.4f} {e_trex:8.4f} {e_blend:8.4f}")
          print("\nWatch whether 'goblin' error rises as magnitude increases (expected — query")
          print("moves away from the archetype), and whether 'blend' ever beats 'goblin' at any")
          print("level (that would be the first sign naive blending adds value somewhere).")
          print("No pass/fail threshold is asserted here — report the numbers, don't invent a cutoff.")
          EOF

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p artifacts/logs artifacts/example-outputs
          cp cloth-fit/build.log artifacts/logs/ 2>/dev/null || true
          cp cloth-fit/*.log artifacts/logs/ 2>/dev/null || true
          find cloth-fit/garment-data -name "step_avatar_*.obj" -o -name "step_garment_*.obj" -o -name "sdf.obj" 2>/dev/null \
            | xargs -I{} cp --parents {} artifacts/example-outputs/ 2>/dev/null || true

      - name: Upload logs (includes the hold-out test result)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hold-out-test-logs
          path: artifacts/logs/
          if-no-files-found: warn

      - name: Upload example outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-outputs
          path: artifacts/example-outputs/
          if-no-files-found: warn
