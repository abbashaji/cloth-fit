name: Archetype-blend hold-out test

# Requires a THIRD avatar you supply yourself, paired with the same
# Puffer_dense garment used by Goblin_Jacket and Trex_Jacket. The repo
# ships no third Puffer_dense avatar (Goblin_Jumpsuit reuses Goblin's
# avatar with a different garment; foxgirl_skirt uses a different
# garment entirely) — confirmed by grepping every setup.json in
# garment-data/. Before running this workflow:
#   1. Create garment-data/<held_out_example>/ in your fork of cloth-fit
#      (or wherever this workflow's checkout points), containing:
#        - avatar.obj, skeleton.obj, skin.txt for your third avatar
#        - a setup.json modeled on Goblin_Jacket/setup.json, but with
#          avatar_mesh_path / target_skeleton_path / avatar_skin_weights_path
#          pointing at your new avatar, and garment_mesh_path /
#          source_skeleton_path / no_fit_spec_path left pointing at
#          Puffer_dense (unchanged), so the garment and its reference
#          pose stay identical to the Goblin/Trex runs.
#   2. Commit and push it to the SAME repo this workflow file lives in —
#      the workflow checks out its own repo (see "Checkout this repo"
#      below), it does not fetch anything from upstream Huangzizhou/cloth-fit.
#   3. Run this workflow with held_out_example set to that directory name.
on:
  workflow_dispatch:
    inputs:
      held_out_example:
        description: 'garment-data/ subdirectory name for the third (held-out) avatar, paired with Puffer_dense'
        required: true
        default: 'Held_Out_Jacket'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git ccache \
            libboost-all-dev \
            libtbb-dev \
            libblosc-dev \
            libopenblas-dev liblapack-dev \
            libsuitesparse-dev
          pip install --break-system-packages -q trimesh numpy

      - name: Checkout this repo
        # This workflow runs inside YOUR repo, which already has the
        # cloth-fit source plus the held-out avatar committed — no need
        # to re-clone upstream. Checked out into a "cloth-fit" subfolder
        # so every later `working-directory: cloth-fit` below still works
        # unchanged.
        uses: actions/checkout@v4
        with:
          path: cloth-fit

      - name: Check held-out example exists before doing any real work
        run: |
          d="cloth-fit/garment-data/${{ inputs.held_out_example }}"
          if [ ! -f "$d/setup.json" ]; then
            echo "::error::$d/setup.json not found. This workflow needs a real third avatar committed there first — see the comments at the top of this file. Nothing to test without it."
            exit 1
          fi
          echo "Found held-out example: $d"
          cat "$d/setup.json"

      - name: Patch BLAS/LAPACK linkage onto the executables
        # Proven fix (rounds 1-3 of the original build spike): polysolve's
        # blas.cmake creates BLAS::BLAS as a child-scope-only imported
        # target; cloth-fit's own top-level CMakeLists.txt can't see it
        # from the parent scope. Fixed by calling find_package(BLAS/LAPACK
        # REQUIRED) directly in cloth-fit's own CMakeLists.txt right after
        # it links polysolve — polysolve's blas.cmake starts with
        # `if(TARGET BLAS::BLAS) return()`, so it reuses ours instead of
        # re-declaring, and cholmod ends up with a real link edge to both.
        run: |
          cd cloth-fit
          sed -i \
            's/target_link_libraries(polyfem PUBLIC polysolve::polysolve)/target_link_libraries(polyfem PUBLIC polysolve::polysolve)\n\nfind_package(BLAS REQUIRED)\nfind_package(LAPACK REQUIRED)/' \
            CMakeLists.txt
          grep -n "find_package(BLAS\|find_package(LAPACK" CMakeLists.txt

      - name: Cache CMake FetchContent / build deps
        uses: actions/cache@v4
        with:
          path: cloth-fit/build/_deps
          key: cloth-fit-deps-${{ hashFiles('cloth-fit/CMakeLists.txt') }}
          restore-keys: |
            cloth-fit-deps-

      - name: Cache CPM source cache (~/.cache/CPM)
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cloth-fit-cpm-${{ hashFiles('cloth-fit/CMakeLists.txt') }}
          restore-keys: |
            cloth-fit-cpm-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Configure
        working-directory: cloth-fit
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DPOLYSOLVE_WITH_MKL=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ..

      - name: Patch SuiteSparse BLAS symbol-suffix convention
        # Proven fix (round 4): polysolve's suitesparse.cmake hardcodes
        # HAVE_BLAS_NO_UNDERSCORE ON / HAVE_BLAS_UNDERSCORE OFF
        # unconditionally. Ubuntu's apt libopenblas.so exports the
        # standard underscored Fortran symbols (dgemm_, not dgemm), so
        # cholmod's internal macros call the wrong name. Flip both
        # values in the vendored recipe CPM already fetched, then
        # reconfigure so SuiteSparse's add_compile_definitions() reruns
        # with the corrected convention.
        working-directory: cloth-fit/build
        run: |
          f=$(find "$HOME/.cache/CPM/polysolve" -path "*/cmake/recipes/suitesparse.cmake" 2>/dev/null | head -n1)
          test -n "$f" && test -f "$f" || { echo "::error::couldn't find polysolve's suitesparse.cmake under \$HOME/.cache/CPM — did Configure step run first?"; exit 1; }
          echo "Found: $f"
          sed -i \
            -e 's/set(HAVE_BLAS_NO_UNDERSCORE ON)/set(HAVE_BLAS_NO_UNDERSCORE OFF)/' \
            -e 's/set(HAVE_BLAS_UNDERSCORE OFF)/set(HAVE_BLAS_UNDERSCORE ON)/' \
            "$f"
          grep -n "HAVE_BLAS_.*UNDERSCORE" "$f"
          grep -q "set(HAVE_BLAS_UNDERSCORE ON)" "$f" || { echo "::error::patch did not apply — sed patterns no longer match $f"; exit 1; }
          cmake -DCMAKE_BUILD_TYPE=Release -DPOLYSOLVE_WITH_MKL=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ..

      - name: Build
        working-directory: cloth-fit/build
        run: |
          nproc
          free -h
          make -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/cloth-fit/build.log"

      - name: Check binary exists
        working-directory: cloth-fit/build
        run: |
          find . -maxdepth 2 -iname "PolyFEM_bin*" -exec ls -la {} \;

      - name: Run Goblin_Jacket, Trex_Jacket, and the held-out example
        working-directory: cloth-fit
        run: |
          for example in Goblin_Jacket Trex_Jacket "${{ inputs.held_out_example }}"; do
            echo "=== Running $example ==="
            cd "garment-data/$example"
            ../../build/PolyFEM_bin -j setup.json --max_threads "$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/cloth-fit/${example//\//_}.log"
            cd ../..
          done

      - name: Compute blend prediction and compare against the real held-out fit
        # The actual hypothesis test. Both Goblin_Jacket and Trex_Jacket
        # start from the same step_garment_0.obj (same garment, same
        # reference pose) — confirmed directly in the prior spike, not
        # assumed here. This computes each one's per-vertex displacement
        # field, averages them 50/50 as the "predicted" correction, and
        # compares that prediction against the held-out avatar's own real
        # (independently solved) final fit. This is a first, simplest-
        # possible version of blending (plain average, not real RBF
        # shape-distance weighting) — deliberately, to test the core idea
        # cheaply before building anything fancier.
        working-directory: cloth-fit
        run: |
          python3 << 'EOF' | tee "$GITHUB_WORKSPACE/cloth-fit/holdout-test-results.log"
          import trimesh
          import numpy as np
          import glob
          import os

          def final_step(dirpath):
              files = glob.glob(os.path.join(dirpath, "step_garment_*.obj"))
              if not files:
                  raise SystemExit(f"::error::no step_garment_*.obj found in {dirpath}")
              idx = max(int(os.path.basename(f).split("_")[-1].split(".")[0]) for f in files)
              return os.path.join(dirpath, f"step_garment_{idx}.obj")

          held_out = "${{ inputs.held_out_example }}"
          dirs = {
              "goblin": "garment-data/Goblin_Jacket",
              "trex": "garment-data/Trex_Jacket",
              "held_out": f"garment-data/{held_out}",
          }

          v0 = {k: np.asarray(trimesh.load(os.path.join(d, "step_garment_0.obj"), process=False).vertices)
                for k, d in dirs.items()}
          vf = {k: np.asarray(trimesh.load(final_step(d), process=False).vertices)
                for k, d in dirs.items()}

          n = {k: v.shape[0] for k, v in v0.items()}
          print("Vertex counts (step_garment_0):", n)
          if len(set(n.values())) != 1:
              raise SystemExit("::error::step_garment_0.obj vertex counts differ across examples — not directly comparable, stopping rather than faking a comparison.")

          disp_goblin = vf["goblin"] - v0["goblin"]
          disp_trex = vf["trex"] - v0["trex"]
          disp_held_out_real = vf["held_out"] - v0["held_out"]
          real_scale = np.linalg.norm(disp_held_out_real, axis=1)

          def evaluate(name, disp_predicted):
              vf_predicted = v0["held_out"] + disp_predicted
              err = np.linalg.norm(vf_predicted - vf["held_out"], axis=1)
              corr = np.corrcoef(np.linalg.norm(disp_predicted, axis=1), real_scale)[0, 1]
              print(f"\n--- {name} ---")
              print(f"  error: mean={err.mean():.4f} median={np.median(err):.4f} std={err.std():.4f} max={err.max():.4f}")
              print(f"  error as fraction of real displacement magnitude (mean): {err.mean() / max(real_scale.mean(), 1e-9):.2%}")
              print(f"  correlation (predicted vs real displacement magnitude, per-vertex): {corr:.3f}")
              return err.mean()

          print("\n=== HOLD-OUT TEST RESULT ===")
          print(f"Real held-out displacement:      mean={real_scale.mean():.4f} max={real_scale.max():.4f}")

          # Four predictors, cheapest/dumbest first, so the blend's actual
          # value-add (or lack of it) is visible against real baselines
          # rather than judged in isolation:
          #   1. no correction at all (predict the reference pose unchanged)
          #   2. Goblin's own fit, unblended (held_out IS a scaled Goblin,
          #      so this is the naive "just use the nearest archetype" guess)
          #   3. Trex's own fit, unblended (the "wrong" archetype, expected
          #      to do worse — a sanity check that the metric behaves as
          #      expected, not just noise)
          #   4. the 50/50 blend already computed in the previous run
          mean_none  = evaluate("Baseline: no correction (reference pose)", np.zeros_like(disp_held_out_real))
          mean_goblin = evaluate("Baseline: Goblin's fit alone (nearest archetype)", disp_goblin)
          mean_trex   = evaluate("Baseline: Trex's fit alone (farthest archetype)", disp_trex)
          mean_blend  = evaluate("50/50 blend (Goblin + Trex averaged)", 0.5 * disp_goblin + 0.5 * disp_trex)

          print("\n=== SUMMARY: mean error, lower is better ===")
          for name, val in [("no correction", mean_none), ("Goblin alone", mean_goblin),
                             ("Trex alone", mean_trex), ("50/50 blend", mean_blend)]:
              print(f"  {name:15s} {val:.4f}")
          print("\nNo pass/fail threshold is asserted here — report the numbers, "
                "don't invent a cutoff. Read them yourself.")
          EOF

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p artifacts/logs artifacts/example-outputs
          cp cloth-fit/build.log artifacts/logs/ 2>/dev/null || true
          cp cloth-fit/*.log artifacts/logs/ 2>/dev/null || true
          find cloth-fit/garment-data -name "step_avatar_*.obj" -o -name "step_garment_*.obj" -o -name "sdf.obj" 2>/dev/null \
            | xargs -I{} cp --parents {} artifacts/example-outputs/ 2>/dev/null || true

      - name: Upload logs (includes the hold-out test result)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hold-out-test-logs
          path: artifacts/logs/
          if-no-files-found: warn

      - name: Upload example outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-outputs
          path: artifacts/example-outputs/
          if-no-files-found: warn
